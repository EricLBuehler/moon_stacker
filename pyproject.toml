[project]
name = "moonstack"
version = "0.1.0"
description = "Lucky-imaging stacker for bursts of RAW moon photos (Bayer drizzle, sub-pixel alignment)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "numba>=0.60",
    "rawpy>=0.23",
    "tifffile>=2024.1",
    "pillow>=10",
    "tqdm>=4.66",
]

[project.scripts]
moonstack = "moonstack.cli:main"
moonstack-synth = "moonstack.synth:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moonstack"]
